# =====================================================================
# FIXTECH - SPA Angular + proxy /api
#
# Instalación en un servidor con Nginx:
#   1. Copiar dist/fixtech-frontend/browser a /var/www/fixtech
#   2. Copiar este archivo a /etc/nginx/sites-available/fixtech
#   3. Ajustar server_name y el upstream del backend
#   4. ln -s /etc/nginx/sites-available/fixtech /etc/nginx/sites-enabled/fixtech
#   5. nginx -t && systemctl reload nginx
#
# El backend debe escuchar en 127.0.0.1:8082 o en el puerto configurado
# en FIXTECH_BACKEND. Para HTTPS, añadir el bloque 443 y el certificado.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name fixtech.example.com;

    root /var/www/fixtech;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Cabeceras de seguridad. Se aplican también a los archivos estáticos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # El hash corresponde al script inline que Angular genera para activar el
    # CSS crítico. Si cambia el build, recalcule el hash con:
    #   python3 deploy/calcular-csp-hash.py dist/fixtech-frontend/browser/index.html
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Compresión de texto.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxy de la API. El backend recibe el prefijo /api.
    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 30m;
    }

    # Archivos con hash: caché agresiva. `expires` mantiene las cabeceras
    # de seguridad heredadas del bloque server.
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2|png|jpe?g|svg|ico)$" {
        expires 1y;
        try_files $uri =404;
    }

    # index.html no se cachea para que el despliegue se refleje de inmediato.
    location = /index.html {
        expires -1;
    }

    # Fallback de la SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
