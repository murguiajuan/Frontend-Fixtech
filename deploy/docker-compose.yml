version: '3.8'

# =====================================================================
# FIXTECH - pila completa para despliegue con Docker Compose.
#
# Uso:
#   cp deploy/.env.example deploy/.env
#   # Editar deploy/.env con secretos reales
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build -d
#
# El frontend se publica en HTTP_PORT (8088 por defecto) y Nginx
# redirige /api al backend. MySQL y el backend no se exponen al host.
# =====================================================================

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en deploy/.env}
      MYSQL_DATABASE: fixtech_db
      MYSQL_USER: ${MYSQL_USER:-fixtech}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en deploy/.env}
      TZ: America/Lima
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ${BACKEND_CONTEXT:-../../IdeaProjects/CalidadSoftware}/db/fixtech_db.sql:/docker-entrypoint-initdb.d/01-fixtech.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - fixtech

  backend:
    build:
      context: ${BACKEND_CONTEXT:-../../IdeaProjects/CalidadSoftware}
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      FIXTECH_DB_URL: jdbc:mysql://mysql:3306/fixtech_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      FIXTECH_DB_USER: ${MYSQL_USER:-fixtech}
      FIXTECH_DB_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en deploy/.env}
      FIXTECH_JWT_SECRET: ${FIXTECH_JWT_SECRET:?Defina FIXTECH_JWT_SECRET en deploy/.env}
      FIXTECH_ARCHIVOS_DIR: /app/uploads
      FIXTECH_OPENAPI_HABILITADO: 'false'
      FIXTECH_CORREO_HABILITADO: ${FIXTECH_CORREO_HABILITADO:-false}
      FIXTECH_CORREO_REMITENTE: ${FIXTECH_CORREO_REMITENTE:-no-reply@fixtech.pe}
      FIXTECH_CORS_ORIGINS: ${FIXTECH_CORS_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      TZ: America/Lima
    volumes:
      - uploads_data:/app/uploads
    networks:
      - fixtech

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      BACKEND_UPSTREAM: http://backend:8080
    ports:
      - '${HTTP_PORT:-8088}:80'
    networks:
      - fixtech

volumes:
  mysql_data:
  uploads_data:

networks:
  fixtech:
    driver: bridge
